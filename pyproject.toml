[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lueflow"
version = "0.1.0"
description = "Reproducible spectral AVT/LUE calculations and OPV table tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
desktop = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "openpyxl>=3.1"]

[project.scripts]
lueflow = "lue_calculator.cli:main"

[tool.setuptools.packages.find]
include = ["lue_calculator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
